name: Crear APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar proyecto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o grok-workspace-android-independiente.zip -d proyecto
          ls -la proyecto

      - name: Compilar
        run: |
          cd proyecto
          chmod +x proyecto.sh
          ./proyecto.sh
